<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f0f2f5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      #form {
        background-color: #ffffff;
        padding: 2.5rem;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        width: 100%;
        max-width: 400px;
      }

      #h1 {
        text-align: center;
        color: #1a1a1a;
        margin-bottom: 2rem;
        font-size: 1.75rem;
      }

      #form p {
        font-weight: 600;
        color: #555;
        margin-bottom: 0.5rem;
        font-size: 0.85rem;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      #form input[type="text"] {
        width: 100%;
        padding: 12px 16px;
        margin-bottom: 1.5rem;
        border: 2px solid #e1e4e8;
        border-radius: 8px;
        font-size: 1rem;
        color: #333;
        transition: all 0.2s ease-in-out;
      }

      #form input[type="text"]:last-of-type {
        margin-bottom: 0;
      }

      #form input[type="text"]:focus {
        outline: none;
        border-color: #007bff;
        box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.15);
      }
    </style>
  </head>
  <body>
    <div id="form">
      <h1 id="h1">keyword Events</h1>
      <p>onkeydown</p>
      <input
        type="text"
        id="input"
        onkeydown="
          document.getElementById('form').style.backgroundColor = this.value
        "
      />
      <p>onkeyup</p>
      <input
        type="text"
        id="input"
        onkeyup="
          document.getElementById('form').style.backgroundColor = this.value
        "
      />
      <p>onkeypress</p>
      <input
        type="text"
        id="input"
        onkeypress="
          document.getElementById('form').style.backgroundColor = this.value
        "
      />
    </div>
  </body>
</html>
