<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Events</title>
    <script>
        // function eventcall(){
            
        //     alert("Mouse event triggered!");
        // }
        function eventcall1(){
            alert("Mouse event triggered!");
        }
    </script>
    <style>
        #box {
            width: 200px;
            height: 200px;
            background-color: lightblue;
            text-align: center;
            line-height: 200px;
            font-size: 20px;
            margin: 50px auto;
            border: 2px solid black;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>

</head>
<body>

    <div id="box" onmouseup="eventcall1()">This is section A</div>
</body>

  
</html>
